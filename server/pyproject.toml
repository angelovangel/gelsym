[project]
name = "gelsym-server"
version = "0.1.0"
description = "Gel band segmentation (GelGenie models) and quantification API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "onnxruntime>=1.17",
    "numpy>=1.26",
    "pillow>=10.0",
    "scipy>=1.11",
    "scikit-image>=0.22",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
